# Typecheck, test and build on every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # release.yml runs the same checks before publishing

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22 # latest 22.x; the server needs >= 22.13 for node:sqlite
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
