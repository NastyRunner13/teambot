# Publish a release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match "version" in package.json. Tags with a suffix (v0.2.0-rc.1) become pre-releases.
#
# 1. The CI checks run.
# 2. Both images are built for amd64 and arm64 (each on its own native runner) and pushed to GitHub's registry:
#    ghcr.io/<owner>/teambot (the server) and ghcr.io/<owner>/teambot-computer (an agent's computer). The server
#    downloads the computer image tagged with its own version when it is missing (see apps/server/src/config.ts).
# 3. A GitHub Release is created with the tagged source plus the built web app, and the CHANGELOG section as notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    name: Check the tag matches package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

  image:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    needs: [ci, version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [server, computer]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: server
            context: .
            repository: teambot
          - image: computer
            context: computer
            repository: teambot-computer
    steps:
      - name: Names
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.repository }}" >> "$GITHUB_ENV"
          platform="${{ matrix.platform }}"
          echo "PAIR=${{ matrix.image }}-${platform//\//-}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      # Pushed by digest only; the merge job below gives the platforms one tag.
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ env.PAIR }}
          cache-to: type=gha,mode=max,scope=release-${{ env.PAIR }}
      - name: Save the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Tag ${{ matrix.image }}
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: server
            repository: teambot
          - image: computer
            repository: teambot-computer
    steps:
      - name: Names
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.repository }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      # 0.1.0 and 0.1, plus latest for a release that isn't a pre-release.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Push the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  release:
    name: Publish release
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The tagged source plus the built web app, so `pnpm install && pnpm start` serves the UI without a build.
      - name: Package
        run: |
          name="teambot-$GITHUB_REF_NAME"
          mkdir -p out
          git archive --format=tar --prefix="$name/" -o "out/$name.tar" "$GITHUB_REF_NAME"
          tar --append -f "out/$name.tar" --transform "s,^,$name/," apps/web/dist
          gzip -9 "out/$name.tar"
          (cd out && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      # Notes: this version's CHANGELOG section (GitHub's generated notes if there is none), then the images.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then echo "NOTES=--notes-file notes.md" >> "$GITHUB_ENV"; else echo "NOTES=--generate-notes" >> "$GITHUB_ENV"; fi
          {
            echo
            echo "## Docker images"
            echo
            echo "For amd64 and arm64 (Apple silicon included):"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/$owner/teambot:$version            # the server and web app"
            echo "docker pull ghcr.io/$owner/teambot-computer:$version   # an agent's computer (the server pulls it when missing)"
            echo '```'
          } > images.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          if [ "$NOTES" = "--generate-notes" ]; then
            gh release create "$GITHUB_REF_NAME" out/* --title "TeamBot $GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
            gh release view "$GITHUB_REF_NAME" --json body -q .body > generated.md
            cat generated.md images.md > notes.md
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            cat images.md >> notes.md
            gh release create "$GITHUB_REF_NAME" out/* --title "TeamBot $GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease
          fi
