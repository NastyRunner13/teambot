# Publish a GitHub Release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match "version" in package.json. Tags with a suffix (v0.2.0-rc.1) become pre-releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The tagged source plus the built web app, so `pnpm install && pnpm start` serves the UI without a build.
      - name: Package
        run: |
          name="teambot-$GITHUB_REF_NAME"
          mkdir -p out
          git archive --format=tar --prefix="$name/" -o "out/$name.tar" "$GITHUB_REF_NAME"
          tar --append -f "out/$name.tar" --transform "s,^,$name/," apps/web/dist
          gzip -9 "out/$name.tar"
          (cd out && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "TeamBot $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease
