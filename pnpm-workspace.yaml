packages:
  - apps/*
  - packages/*
  - computer/computerd

onlyBuiltDependencies:
  - esbuild

# Optional native add-ons (ssh2 and cpu-features through dockerode, protobufjs through OpenTelemetry) that
# TeamBot never needs: skip their install scripts without the "Ignored build scripts" warning.
ignoredBuiltDependencies:
  - cpu-features
  - protobufjs
  - ssh2
