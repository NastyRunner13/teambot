[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_SCREEN_SIZE)sx24 -ac -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/tmp/xvfb.log
redirect_stderr=true

[program:fluxbox]
command=/bin/sh -c 'until xdpyinfo -display :1 >/dev/null 2>&1; do sleep 0.2; done; exec fluxbox'
priority=20
autorestart=true
stdout_logfile=/tmp/fluxbox.log
redirect_stderr=true

[program:chromium]
command=/usr/local/bin/start-chromium.sh
priority=30
autorestart=true
startsecs=3
stdout_logfile=/tmp/chromium.log
redirect_stderr=true

[program:x11vnc]
command=/bin/sh -c 'until xdpyinfo -display :1 >/dev/null 2>&1; do sleep 0.2; done; exec x11vnc -display :1 -forever -shared -rfbport 5900 -rfbauth /tmp/vncpass -noxdamage -quiet'
priority=40
autorestart=true
stdout_logfile=/tmp/x11vnc.log
redirect_stderr=true

[program:computerd]
command=/usr/local/bin/node /opt/computerd/dist/server.js
directory=/home/agent
priority=50
autorestart=true
stdout_logfile=/tmp/computerd.log
redirect_stderr=true
